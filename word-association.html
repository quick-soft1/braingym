    const TOTAL_ROUNDS = 50;
    let audioCtx = null;
    let isMuted = false;
    let synth = window.speechSynthesis;
    let availableVoices = [];

    function populateVoices() {
        if (!synth) return;
        availableVoices = synth.getVoices();
    }
    populateVoices();
    if (synth && synth.onvoiceschanged !== undefined) {
        synth.onvoiceschanged = populateVoices;
    }

    function stopAudio() {
        if (synth) {
            try { synth.cancel(); } catch(e) {}
        }
    }

    function unlockAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function toggleMute(e) {
        if (e) e.stopPropagation();
        unlockAudio();
        isMuted = !isMuted;
        document.getElementById('mute-btn').innerText = isMuted ? '🔇' : '🔊';
        if (isMuted) stopAudio();
    }

    function toggleModal(show) {
        document.getElementById('instructions-modal').classList.toggle('active', show);
    }

    function playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
        if (isMuted) return;
        unlockAudio();
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        } catch(e) {}
    }

    function playFanfare() {
        if (isMuted) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
            setTimeout(() => playTone(freq, 'sine', 0.25, 0.15), idx * 120);
        });
    }

    function createRound(roundNum, diff, timer, pose, prompt, correctOpt, wrongOpts) {
        let allOptions = [correctOpt, ...wrongOpts];
        let indexed = allOptions.map((opt, i) => ({ text: opt, isCorrect: i === 0 }));
        
        for (let i = indexed.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [indexed[i], indexed[j]] = [indexed[j], indexed[i]];
        }

        return {
            round: roundNum,
            difficulty: diff,
            timer: timer,
            pose: pose,
            prompt: prompt,
            options: indexed.map(o => o.text),
            answer: indexed.findIndex(o => o.isCorrect)
        };
    }

            { pose: "Paso lateral: Mueve la pierna izquierda afuera y adentro 🦵", prompt: "¿Qué palabra rima con 'MAR'?", correct: "Amar", wrong: ["Agua", "Ola", "Pez"] },
            { pose: "Postura Tándem: Mira fijamente a un punto en la pared 👁️", prompt: "¿Cuál es un SINÓNIMO de 'SILENCIOSO'?", correct: "Callado", wrong: ["Ruidoso", "Rápido", "Brillante"] },
            { pose: "Marche a paso lento y controlado 🥁", prompt: "¿Qué palabra empieza con la letra 'M'?", correct: "Montaña", wrong: ["Valle", "Río", "Lago"] },
            { pose: "Postura Tándem uniendo las palmas de las manos 🤲", prompt: "¿Qué palabra rima con 'FLOR'?", correct: "Amor", wrong: ["Sol", "Mar", "Luz"] },
            { pose: "Marcha suave balanceando los brazos 🏃", prompt: "¿Cuál es un SINÓNIMO de 'INTELIGENTE'?", correct: "Astuto", wrong: ["Lento", "Torpe", "Pesado"] },
            { pose: "Postura Tándem cruzando los brazos 🫂", prompt: "¿Qué palabra empieza con la letra 'P'?", correct: "Pingüino", wrong: ["Tigre", "León", "Oso"] },
            { pose: "Pasos laterales con rotación de hombros 🔄", prompt: "¿Qué palabra rima con 'CANCION'?", correct: "Corazón", wrong: ["Sol", "Luz", "Mar"] },
            { pose: "Postura Tándem mirando hacia el techo ☁️", prompt: "¿Cuál es un SINÓNIMO de 'ANTIGUO'?", correct: "Viejo", wrong: ["Nuevo", "Moderno", "Fresco"] },
            { pose: "Marcha en el sitio tocando con la punta del pie 🦶", prompt: "¿Qué palabra empieza con la letra 'F'?", correct: "Halcón", wrong: ["Serpiente", "Ballena", "Caballo"] },
            { pose: "Postura Tándem, pie derecho adelante 🧍", prompt: "¿Qué palabra rima con 'RÍO'?", correct: "Frío", wrong: ["Mar", "Agua", "Pez"] },
            { pose: "Postura Tándem, pie izquierdo adelante 🧘", prompt: "¿Cuál es un SINÓNIMO de 'CALMA'?", correct: "Paz", wrong: ["Ruido", "Furia", "Veloz"] },
            { pose: "Marcha con manos en la cintura 🏃", prompt: "¿Qué palabra empieza con la letra 'T'?", correct: "Tormenta", wrong: ["Lluvia", "Nube", "Sol"] },
            { pose: "Postura Tándem respirando profundamente 🫁", prompt: "¿Qué palabra rima con 'VIENTO'?", correct: "Ciento", wrong: ["Sol", "Mar", "Luz"] },

            // 36-50
            { pose: "Equilibrio en un pie: Levanta el pie derecho 🦩", prompt: "¿Cuál es el OPUESTO de 'EXPANDIR'?", correct: "Encoger", wrong: ["Crecer", "Estirar", "Construir"] },
            { pose: "Equilibrio en un pie: Levanta el pie izquierdo 🦩", prompt: "¿Cuál es el OPUESTO de 'ANTIGUO'?", correct: "Moderno", wrong: ["Viejo", "Histórico", "Clásico"] },
            { pose: "Postura de Flamenco: Pierna derecha doblada 🦩", prompt: "¿Cuál es el OPUESTO de 'DIFÍCIL'?", correct: "Fácil", wrong: ["Complicado", "Pesado", "Duro"] },
            { pose: "Postura del Árbol: Talón apoyado en el tobillo opuesto 🌳", prompt: "¿Qué palabra está asociada con 'OCÉANO'?", correct: "Mareas", wrong: ["Desierto", "Montaña", "Bosque"] },
            { pose: "Equilibrio en un pie: Rodilla derecha a 90 grados 🦩", prompt: "¿Cuál es el OPUESTO de 'SUAVE'?", correct: "Áspero", wrong: ["Amable", "Dulce", "Liso"] },
            { pose: "Postura del Árbol: Talón izquierdo en el tobillo derecho 🌳", prompt: "¿Qué palabra se asocia con 'INVIERNO'?", correct: "Nieve", wrong: ["Calor", "Palmera", "Playa"] },
            { pose: "Equilibrio sobre los dedos del pie derecho 🦶", prompt: "¿Cuál es el OPUESTO de 'VICTORIA'?", correct: "Derrota", wrong: ["Triunfo", "Éxito", "Medalla"] },
            { pose: "Levanta la pierna izquierda con brazos abiertos 🦅", prompt: "¿Qué instrumento se asocia con 'ASTRONOMÍA'?", correct: "Telescopio", wrong: ["Microscopio", "Estetoscopio", "Brújula"] },
            { pose: "Equilibrio sobre un pie sosteniendo el talón arriba 🦶", prompt: "¿Cuál es el OPUESTO de 'FRECUENTE'?", correct: "Raro", wrong: ["A menudo", "Siempre", "Diario"] },
            { pose: "Postura del Árbol: Mantén la estabilidad 🌳", prompt: "¿Qué concepto se asocia con 'MÚSICA'?", correct: "Sinfonía", wrong: ["Lienzo", "Estatua", "Novela"] },
            { pose: "Equilibrio en un pie girando la cabeza 🗣️", prompt: "¿Cuál es el OPUESTO de 'GENEROSO'?", correct: "Tacaño", wrong: ["Amable", "Rico", "Dador"] },
            { pose: "Equilibrio en el otro pie 🦩", prompt: "¿Qué palabra pertenece a 'GEOGRAFÍA'?", correct: "Península", wrong: ["Sinfonía", "Triángulo", "Lápiz"] },
            { pose: "Postura Tándem con ojos cerrados 3s 🙈", prompt: "¿Cuál es un SINÓNIMO de 'OBSTÁCULO'?", correct: "Barrera", wrong: ["Camino", "Solución", "Puente"] },
            { pose: "Equilibrio talón-punta con brazos cruzados 🙅", prompt: "¿Qué palabra se asocia con 'ARQUEOLOGÍA'?", correct: "Fósil", wrong: ["Galaxia", "Estetoscopio", "Telescopio"] },
            { pose: "Equilibrio en un pie con rodilla doblada 🦵", prompt: "¿Cuál es el OPUESTO de 'TRANSPARENTE'?", correct: "Opaco", wrong: ["Claro", "Vidrio", "Brillante"] }
        ];

        for (let i = 0; i < TOTAL_ROUNDS; i++) {
            let diff = i < 15 ? 1 : (i < 35 ? 2 : 3);
            let timeSec = diff === 1 ? 12 : (diff === 2 ? 10 : 8);

            db.en.push(createRound(i + 1, diff, timeSec, enData[i].pose, enData[i].prompt, enData[i].correct, enData[i].wrong));
            db.hi.push(createRound(i + 1, diff, timeSec, hiData[i].pose, hiData[i].prompt, hiData[i].correct, hiData[i].wrong));
            db.es.push(createRound(i + 1, diff, timeSec, esData[i].pose, esData[i].prompt, esData[i].correct, esData[i].wrong));
        }

        return db;
    }

    const GAME_DB = buildGameDatabase();

    let currentLang = 'en';
    let currentRound = 1;
    let lives = 3;
    let gameState = 'IDLE';
    let timerInterval = null;

    function changeLanguage() {
        stopAudio();
        currentLang = document.getElementById('lang-select').value;
        updateLangUI();
        resetRoundView();
    }

    function updateLangUI() {
        const t = TRANSLATIONS[currentLang];
        document.getElementById('app-title').innerText = t.appTitle;
        document.getElementById('modal-title').innerText = t.instructionsTitle;
        document.getElementById('modal-content').innerHTML = t.instructionsText;
        document.getElementById('modal-close-btn').innerText = t.closeBtn;
        document.getElementById('pose-header').innerText = t.poseHeader;

        updateMetaUI();
    }

    function updateLivesUI() {
        const hearts = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
        document.getElementById('lives-lbl').innerText = hearts;
    }

    function updateMetaUI() {
        const t = TRANSLATIONS[currentLang];
        document.getElementById('round-lbl').innerText = `${t.roundText} ${currentRound} / ${TOTAL_ROUNDS}`;

        let diffText = currentRound <= 15 ? t.easy : (currentRound <= 35 ? t.medium : t.hard);
        document.getElementById('difficulty-lbl').innerText = diffText;

        const progressPct = ((currentRound - 1) / TOTAL_ROUNDS) * 100;
        document.getElementById('progress-fill').style.width = `${progressPct}%`;

        updateLivesUI();
    }

    function resetRoundView() {
        gameState = 'IDLE';
        stopAudio();
        clearInterval(timerInterval);
        const t = TRANSLATIONS[currentLang];
        const roundData = GAME_DB[currentLang][currentRound - 1];

        document.getElementById('status-banner').innerText = `${t.startBanner}${currentRound}!`;
        document.getElementById('pose-instruction').innerText = roundData.pose;
        document.getElementById('task-prompt').innerText = roundData.prompt;
        document.getElementById('task-subtext').innerText = `${t.startBanner}${currentRound}`;

        document.getElementById('timer-container').classList.add('hidden');
        document.getElementById('options-container').classList.add('hidden');

        const mainBtn = document.getElementById('main-btn');
        mainBtn.innerText = t.beginBtn;
        mainBtn.className = "btn";
        updateMetaUI();
    }

    function handleMainAction() {
        playTone(520, 'sine', 0.1, 0.08);
        if (gameState === 'GAME_OVER') {
            currentRound = 1;
            lives = 3;
            resetRoundView();
            return;
        }
        if (gameState === 'IDLE' || gameState === 'RESULTS') {
            startRoundChallenge();
        }
    }

    function getVoiceForLang(lang) {
        if (!availableVoices.length) populateVoices();
        const codeMap = { 
            hi: ['hi', 'hi-in', 'hindi'], 
            es: ['es', 'es-es', 'es-mx', 'spanish'], 
            en: ['en', 'en-us', 'english'] 
        };
        const targets = codeMap[lang] || ['en'];

        for (let target of targets) {
            let found = availableVoices.find(v => 
                v.lang.toLowerCase().replace('_','-').startsWith(target) || 
                v.name.toLowerCase().includes(target)
            );
            if (found) return found;
        }
        return null;
    }

    function readAloud(textToSpeak) {
        if (isMuted || !synth) return;
        stopAudio();
        
        try {
            const utter = new SpeechSynthesisUtterance(textToSpeak);
            const matchedVoice = getVoiceForLang(currentLang);
            if (matchedVoice) {
                utter.voice = matchedVoice;
                utter.lang = matchedVoice.lang;
            } else {
                if (currentLang === 'hi') utter.lang = 'hi-IN';
                else if (currentLang === 'es') utter.lang = 'es-ES';
                else utter.lang = 'en-US';
            }

            utter.rate = 0.9;
            synth.speak(utter);
        } catch(e) {}
    }

    function startRoundChallenge() {
        stopAudio();
        gameState = 'PLAYING';
        const roundData = GAME_DB[currentLang][currentRound - 1];

        document.getElementById('status-banner').innerText = `Maintain Pose & Solve! Time: ${roundData.timer}s`;
        document.getElementById('pose-instruction').innerText = roundData.pose;
        document.getElementById('task-prompt').innerText = roundData.prompt;
        document.getElementById('task-subtext').innerText = "";

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        optionsContainer.classList.remove('hidden');

        roundData.options.forEach((optText, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span>${optText}</span>`;
            btn.onclick = () => handleAnswer(idx, btn);
            optionsContainer.appendChild(btn);
        });

        document.getElementById('main-btn').classList.add('hidden');

        readAloud(`${roundData.pose}. ${roundData.prompt}`);
        startTimer(roundData.timer);
    }

    function startTimer(seconds) {
        clearInterval(timerInterval);
        document.getElementById('timer-container').classList.remove('hidden');
        const timerFill = document.getElementById('timer-fill');
        timerFill.style.width = '100%';
        timerFill.style.backgroundColor = '#4cc9f0';

        let startTime = Date.now();
        let totalDuration = seconds * 1000;

        timerInterval = setInterval(() => {
            let elapsed = Date.now() - startTime;
            let remaining = Math.max(0, totalDuration - elapsed);
            let pct = (remaining / totalDuration) * 100;

            timerFill.style.width = `${pct}%`;

            if (pct < 30) {
                timerFill.style.backgroundColor = '#e63946';
            }

            if (remaining <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 50);
    }

    function handleTimeout() {
        if (gameState !== 'PLAYING') return;
        stopAudio();
        lives--;
        updateLivesUI();
        playTone(300, 'sawtooth', 0.25, 0.1);

        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.onclick = null);

        document.getElementById('status-banner').innerText = "⏰ Time's up! Balance lost.";

        setTimeout(() => {
            if (lives <= 0) showGameOver();
            else showResults(false);
        }, 1200);
    }

    function handleAnswer(selectedIdx, buttonEl) {
        if (gameState !== 'PLAYING') return;
        stopAudio();
        clearInterval(timerInterval);

        const roundData = GAME_DB[currentLang][currentRound - 1];
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.onclick = null);

        if (selectedIdx === roundData.answer) {
            buttonEl.classList.add('correct');
            buttonEl.innerHTML += ` <span>✅</span>`;
            playTone(600, 'sine', 0.15, 0.1);
            setTimeout(() => showResults(true), 1000);
        } else {
            lives--;
            updateLivesUI();
            buttonEl.classList.add('incorrect');
            buttonEl.innerHTML += ` <span>❌</span>`;
            buttons[roundData.answer].classList.add('correct');
            playTone(300, 'sawtooth', 0.2, 0.08);

            setTimeout(() => {
                if (lives <= 0) showGameOver();
                else showResults(false);
            }, 1200);
        }
    }

    function showGameOver() {
        gameState = 'GAME_OVER';
        stopAudio();
        clearInterval(timerInterval);
        const t = TRANSLATIONS[currentLang];

        document.getElementById('options-container').classList.add('hidden');
        document.getElementById('timer-container').classList.add('hidden');

        document.getElementById('status-banner').innerText = t.gameOverBanner;
        document.getElementById('task-prompt').innerText = t.gameOverTitle;
        document.getElementById('task-subtext').innerText = `You made it to Round ${currentRound}.`;

        const mainBtn = document.getElementById('main-btn');
        mainBtn.innerText = t.restartBtn;
        mainBtn.className = "btn";
        mainBtn.classList.remove('hidden');

        playTone(200, 'sawtooth', 0.4, 0.15);
    }

    function showResults(isCorrect) {
        gameState = 'RESULTS';
        stopAudio();
        const t = TRANSLATIONS[currentLang];

        document.getElementById('options-container').classList.add('hidden');
        document.getElementById('timer-container').classList.add('hidden');

        if (isCorrect) {
            document.getElementById('status-banner').innerText = `✅ Great Dual-Tasking! Round ${currentRound} Complete.`;
            playTone(650, 'sine', 0.2, 0.1);
        }

        if (currentRound < TOTAL_ROUNDS) {
            currentRound++;
            updateMetaUI();

            const nextRoundData = GAME_DB[currentLang][currentRound - 1];
            document.getElementById('pose-instruction').innerText = nextRoundData.pose;
            document.getElementById('task-prompt').innerText = nextRoundData.prompt;

            const mainBtn = document.getElementById('main-btn');
            mainBtn.innerText = t.nextRoundBtn;
            mainBtn.className = "btn";
            mainBtn.classList.remove('hidden');
        } else {
            document.getElementById('status-banner').innerText = t.completeBanner;
            document.getElementById('task-prompt').innerText = t.completeTitle;
            document.getElementById('main-btn').classList.add('hidden');
            playFanfare();
        }
    }

    // Initialize Game
    updateLangUI();
    resetRoundView();
</script>
