<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micro-Strategy Multi-Turn Puzzle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .game-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 1.25rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* Top Bar */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #c084fc;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .top-btns { display: flex; gap: 0.4rem; }
    .icon-btn {
      background: #334155;
      border: none;
      color: #f8fafc;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .icon-btn:hover { background: #475569; }

    /* Stats Row */
    .stats-bar {
      background: #0f172a;
      padding: 0.6rem 1rem;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .round-tag { color: #facc15; }
    .lives { color: #f43f5e; letter-spacing: 2px; }
    .gem-status { color: #38bdf8; }

    /* Banner */
    .banner {
      background: #38bdf81a;
      border: 1px solid #38bdf840;
      color: #7dd3fc;
      text-align: center;
      padding: 0.5rem;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .speed-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: #94a3b8;
    }
    select {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      font-size: 0.78rem;
      outline: none;
      cursor: pointer;
    }

    /* Grid Area */
    .grid-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      background: #0f172a;
      padding: 10px;
      border-radius: 16px;
      border: 1px solid #334155;
      width: 280px;
      height: 280px;
    }
    .cell {
      background: #1e293b;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      transition: background 0.2s;
      position: relative;
    }

    .player-ball {
      width: 22px;
      height: 22px;
      background: radial-gradient(circle at 30% 30%, #60a5fa, #1d4ed8);
      border-radius: 50%;
      box-shadow: 0 0 10px #3b82f6;
      z-index: 2;
    }
    .star-target { font-size: 1.4rem; animation: pulse 1.5s infinite; }
    .star-target.locked { opacity: 0.4; filter: grayscale(1); }
    .wall-tile { font-size: 1.2rem; }
    .gem-item { font-size: 1.2rem; animation: bounce 1.2s infinite alternate; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-3px); }
    }

    /* Move Sequence Slots */
    .sequence-section {
      background: #0f172a;
      padding: 0.6rem;
      border-radius: 12px;
      text-align: center;
    }
    .sequence-section p {
      font-size: 0.7rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.35rem;
    }
    .slots-wrapper {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      min-height: 38px;
    }
    .slot {
      width: 36px;
      height: 36px;
      background: #1e293b;
      border: 1px dashed #475569;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: #38bdf8;
    }
    .slot.filled { border-style: solid; border-color: #38bdf8; }

    /* D-Pad Controls */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(2, 38px);
      gap: 6px;
      justify-content: center;
      margin: 0.1rem 0;
    }
    .dbtn {
      background: #334155;
      border: 1px solid #475569;
      color: #f8fafc;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .dbtn:hover { background: #475569; }
    .dbtn:active { transform: scale(0.95); }
    .dbtn-clear { background: #f43f5e; border-color: #e11d48; font-size: 0.68rem; }
    .dbtn-clear:hover { background: #e11d48; }

    /* Execute Button */
    .btn-execute {
      background: #475569;
      color: #94a3b8;
      border: none;
      padding: 0.75rem;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.92rem;
      cursor: not-allowed;
      transition: all 0.2s;
    }
    .btn-execute.ready {
      background: #38bdf8;
      color: #0f172a;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }
    .btn-execute.ready:hover { background: #7dd3fc; }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="header">
      <div class="title">🧩 Micro-Strategy</div>
      <div class="top-btns">
        <button class="icon-btn" onclick="restartGame()" title="Restart">🔄</button>
        <button class="icon-btn" onclick="toggleSound()" id="snd-btn" title="Sound">🔊</button>
      </div>
    </div>

    <div class="stats-bar">
      <div class="round-tag" id="round-display">⭐ Round: 1/30</div>
      <div class="lives" id="lives-display">❤️❤️❤️</div>
      <div class="gem-status" id="gem-display">💎 0/0</div>
    </div>

    <div class="banner" id="banner-text">Plan 4 steps at a time to navigate the maze!</div>

    <div class="speed-bar">
      ⏱️ Sim Speed:
      <select id="speed-select" onchange="updateSpeed()">
        <option value="450">Slow (0.45s)</option>
        <option value="280" selected>Normal (0.28s)</option>
        <option value="140">Fast (0.14s)</option>
      </select>
    </div>

    <div class="grid-container">
      <div class="grid" id="grid"></div>
    </div>

    <div class="sequence-section">
      <p id="slot-count-label">TURN BUFFER (MAX 4 STEPS)</p>
      <div class="slots-wrapper" id="slots-wrapper"></div>
    </div>

    <div class="dpad">
      <div></div>
      <button class="dbtn" onclick="addMove('UP')">⬆️</button>
      <div></div>
      <button class="dbtn" onclick="addMove('LEFT')">⬅️</button>
      <button class="dbtn dbtn-clear" onclick="clearMoves()">CLEAR</button>
      <button class="dbtn" onclick="addMove('RIGHT')">➡️</button>
      <div></div>
      <button class="dbtn" onclick="addMove('DOWN')">⬇️</button>
      <div></div>
    </div>

    <button class="btn-execute" id="exec-btn" onclick="executeSequence()">Execute Sequence 🚀</button>
  </div>

  <script>
    const GRID_SIZE = 5;
    const MAX_TURN_STEPS = 4; // Capped at 4 moves per execution batch

    let round = 1;
    let lives = 3;
    let soundEnabled = true;
    let simSpeed = 280;

    let playerX = 0, playerY = 0;
    let startX = 0, startY = 0;
    let starX = 0, starY = 0;
    let walls = [];
    let gems = [];
    let collectedGems = 0;

    let plannedMoves = [];
    let isSimulating = false;

    function playAudio(type) {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.frequency.value = 400;
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          osc.start(); osc.stop(ctx.currentTime + 0.04);
        } else if (type === 'gem') {
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.setValueAtTime(900, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          osc.start(); osc.stop(ctx.currentTime + 0.16);
        } else if (type === 'step') {
          osc.frequency.value = 280;
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          osc.start(); osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'win') {
          osc.frequency.setValueAtTime(523, ctx.currentTime);
          osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
          osc.frequency.setValueAtTime(783, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.start(); osc.stop(ctx.currentTime + 0.35);
        } else if (type === 'fail') {
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.setValueAtTime(120, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          osc.start(); osc.stop(ctx.currentTime + 0.3);
        }
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('snd-btn').innerText = soundEnabled ? '🔊' : '🔇';
    }

    function updateSpeed() {
      simSpeed = parseInt(document.getElementById('speed-select').value);
    }

    // BFS Pathfinding to ensure map has a valid multi-turn solution
    function bfsPath(fromX, fromY, toX, toY, currentWalls) {
      let visited = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(false));
      let queue = [{ x: fromX, y: fromY, dist: 0 }];
      visited[fromY][fromX] = true;

      const dirs = [{ x: 0, y: -1 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 1, y: 0 }];

      while (queue.length > 0) {
        let curr = queue.shift();
        if (curr.x === toX && curr.y === toY) return curr.dist;

        for (let d of dirs) {
          let nx = curr.x + d.x;
          let ny = curr.y + d.y;

          if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE && !visited[ny][nx]) {
            let isWall = currentWalls.some(w => w.x === nx && w.y === ny);
            if (!isWall) {
              visited[ny][nx] = true;
              queue.push({ x: nx, y: ny, dist: curr.dist + 1 });
            }
          }
        }
      }
      return -1;
    }

    function setupRound() {
      plannedMoves = [];
      isSimulating = false;
      collectedGems = 0;

      let wallCount = Math.min(3 + Math.floor(round / 3), 7);
      let gemCount = round >= 12 ? 2 : (round >= 4 ? 1 : 0);
      let minTotalSteps = Math.min(5 + Math.floor(round / 2), 12);

      let validBoard = false;
      let attempts = 0;

      while (!validBoard && attempts < 500) {
        attempts++;
        walls = [];
        gems = [];

        playerX = Math.floor(Math.random() * GRID_SIZE);
        playerY = Math.floor(Math.random() * GRID_SIZE);

        while (walls.length < wallCount) {
          let wx = Math.floor(Math.random() * GRID_SIZE);
          let wy = Math.floor(Math.random() * GRID_SIZE);
          if ((wx !== playerX || wy !== playerY) && !walls.some(w => w.x === wx && w.y === wy)) {
            walls.push({ x: wx, y: wy });
          }
        }

        let gemAttempts = 0;
        while (gems.length < gemCount && gemAttempts < 50) {
          gemAttempts++;
          let gx = Math.floor(Math.random() * GRID_SIZE);
          let gy = Math.floor(Math.random() * GRID_SIZE);
          if ((gx !== playerX || gy !== playerY) && 
              !walls.some(w => w.x === gx && w.y === gy) &&
              !gems.some(g => g.x === gx && g.y === gy)) {
            gems.push({ x: gx, y: gy, collected: false });
          }
        }

        let starAttempts = 0;
        starX = -1; starY = -1;
        while (starX === -1 && starAttempts < 50) {
          starAttempts++;
          let sx = Math.floor(Math.random() * GRID_SIZE);
          let sy = Math.floor(Math.random() * GRID_SIZE);
          if ((sx !== playerX || sy !== playerY) && 
              !walls.some(w => w.x === sx && w.y === sy) &&
              !gems.some(g => g.x === sx && g.y === sy)) {
            starX = sx; starY = sy;
          }
        }

        if (starX === -1 || (gemCount > 0 && gems.length < gemCount)) continue;

        let totalDist = 0;
        let currX = playerX, currY = playerY;
        let pathPossible = true;

        for (let g of gems) {
          let d = bfsPath(currX, currY, g.x, g.y, walls);
          if (d === -1) { pathPossible = false; break; }
          totalDist += d;
          currX = g.x; currY = g.y;
        }

        if (pathPossible) {
          let finalDist = bfsPath(currX, currY, starX, starY, walls);
          if (finalDist !== -1) {
            totalDist += finalDist;
            if (totalDist >= minTotalSteps) {
              validBoard = true;
            }
          }
        }

        if (!validBoard && attempts % 100 === 0) {
          minTotalSteps = Math.max(4, minTotalSteps - 1);
        }
      }

      startX = playerX;
      startY = playerY;

      updateUI();
      renderGrid();
      renderSlots();
    }

    function updateUI() {
      document.getElementById('round-display').innerText = `⭐ Round: ${round}/30`;
      document.getElementById('lives-display').innerText = '❤️'.repeat(lives);
      document.getElementById('gem-display').innerText = gems.length > 0 ? `💎 ${collectedGems}/${gems.length}` : `💎 None`;
      
      let bannerMsg = gems.length > 0 
        ? `Collect ${gems.length} Gem(s) 💎 then reach the Star ⭐! (Max 4 moves/turn)`
        : `Navigate maze to reach the Star ⭐! (Max 4 moves/turn)`;
      document.getElementById('banner-text').innerText = bannerMsg;
    }

    function renderGrid() {
      const gridEl = document.getElementById('grid');
      gridEl.innerHTML = '';

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';

          let isWall = walls.some(w => w.x === c && w.y === r);
          let gem = gems.find(g => g.x === c && g.y === r);

          if (c === playerX && r === playerY) {
            const ball = document.createElement('div');
            ball.className = 'player-ball';
            cell.appendChild(ball);
          } else if (c === starX && r === starY) {
            const star = document.createElement('div');
            let isLocked = gems.some(g => !g.collected);
            star.className = `star-target ${isLocked ? 'locked' : ''}`;
            star.innerText = isLocked ? '🔒' : '⭐';
            cell.appendChild(star);
          } else if (gem && !gem.collected) {
            const gemEl = document.createElement('div');
            gemEl.className = 'gem-item';
            gemEl.innerText = '💎';
            cell.appendChild(gemEl);
          } else if (isWall) {
            const wallEl = document.createElement('div');
            wallEl.className = 'wall-tile';
            wallEl.innerText = '🧱';
            cell.appendChild(wallEl);
          }

          gridEl.appendChild(cell);
        }
      }
    }

    function renderSlots() {
      const wrapper = document.getElementById('slots-wrapper');
      wrapper.innerHTML = '';

      const arrows = { UP: '⬆️', DOWN: '⬇️', LEFT: '⬅️', RIGHT: '➡️' };

      for (let i = 0; i < MAX_TURN_STEPS; i++) {
        const slot = document.createElement('div');
        slot.className = `slot ${plannedMoves[i] ? 'filled' : ''}`;
        slot.innerText = plannedMoves[i] ? arrows[plannedMoves[i]] : '';
        wrapper.appendChild(slot);
      }

      const execBtn = document.getElementById('exec-btn');
      if (plannedMoves.length > 0 && !isSimulating) {
        execBtn.classList.add('ready');
      } else {
        execBtn.classList.remove('ready');
      }
    }

    function addMove(dir) {
      if (isSimulating || plannedMoves.length >= MAX_TURN_STEPS) return;
      playAudio('click');
      plannedMoves.push(dir);
      renderSlots();
    }

    function clearMoves() {
      if (isSimulating) return;
      playAudio('click');
      plannedMoves = [];
      renderSlots();
    }

    async function executeSequence() {
      if (plannedMoves.length === 0 || isSimulating) return;

      isSimulating = true;
      document.getElementById('exec-btn').classList.remove('ready');

      let currentX = playerX;
      let currentY = playerY;
      let hitWall = false;

      for (let i = 0; i < plannedMoves.length; i++) {
        await new Promise(resolve => setTimeout(resolve, simSpeed));

        const move = plannedMoves[i];
        let nextX = currentX;
        let nextY = currentY;

        if (move === 'UP') nextY = Math.max(0, currentY - 1);
        if (move === 'DOWN') nextY = Math.min(GRID_SIZE - 1, currentY + 1);
        if (move === 'LEFT') nextX = Math.max(0, currentX - 1);
        if (move === 'RIGHT') nextX = Math.min(GRID_SIZE - 1, currentX + 1);

        // Check Wall Collision
        if (walls.some(w => w.x === nextX && w.y === nextY)) {
          hitWall = true;
          break;
        }

        currentX = nextX;
        currentY = nextY;
        playerX = currentX;
        playerY = currentY;

        // Check Gem Pickups
        let g = gems.find(g => g.x === currentX && g.y === currentY && !g.collected);
        if (g) {
          g.collected = true;
          collectedGems++;
          playAudio('gem');
          updateUI();
        } else {
          playAudio('step');
        }

        renderGrid();
      }

      await new Promise(resolve => setTimeout(resolve, 200));

      let allGemsCollected = gems.every(g => g.collected);

      if (hitWall) {
        playAudio('fail');
        lives--;
        if (lives <= 0) {
          alert('❌ Game Over! Out of lives.');
          restartGame();
        } else {
          // Reset Round to start position on crash
          playerX = startX;
          playerY = startY;
          gems.forEach(g => g.collected = false);
          collectedGems = 0;
          plannedMoves = [];
          updateUI();
          renderGrid();
          renderSlots();
          isSimulating = false;
        }
      } else if (playerX === starX && playerY === starY && allGemsCollected) {
        playAudio('win');
        if (round >= 30) {
          alert('🏆 Master Puzzle Solver! You beat all 30 rounds!');
          restartGame();
        } else {
          round++;
          setupRound();
        }
      } else {
        // Safe turn completion: allow next 4-step sequence input
        plannedMoves = [];
        renderSlots();
        isSimulating = false;
      }
    }

    function restartGame() {
      round = 1;
      lives = 3;
      setupRound();
    }

    window.onload = setupRound;
  </script>
</body>
</html>
