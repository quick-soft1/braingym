<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mind Gym Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; height: 100vh; overflow: hidden; }
    
    /* Layout Container */
    .arcade-container { display: flex; width: 100vw; height: 100vh; }
    
    /* Left Pane - Sidebar */
    .sidebar {
      width: 320px;
      min-width: 280px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    .sidebar-header {
      padding: 1.25rem;
      border-bottom: 1px solid #334155;
      background: #0f172a;
    }
    .sidebar-header h1 {
      font-size: 1.25rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .sidebar-header p {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }
    
    .game-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
    }
    
    .game-item {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.85rem 1rem;
      margin-bottom: 0.5rem;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #cbd5e1;
      text-align: left;
      width: 100%;
    }
    
    .game-item:hover {
      background: #334155;
      color: #f8fafc;
    }
    
    .game-item.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #38bdf8;
      font-weight: 600;
    }
    
    .game-icon {
      font-size: 1.4rem;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      flex-shrink: 0;
    }
    
    .game-info {
      overflow: hidden;
    }
    
    .game-title {
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .game-desc {
      font-size: 0.75rem;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: normal;
    }
    .game-item.active .game-desc {
      color: #7dd3fc;
    }

    /* Right Pane - Play Area */
    .main-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #0f172a;
    }
    
    .stage-header {
      padding: 1rem 1.5rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .stage-title-group h2 {
      font-size: 1.1rem;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .stage-title-group p {
      font-size: 0.8rem;
      color: #94a3b8;
    }
    
    .stage-actions {
      display: flex;
      gap: 0.5rem;
    }
    
    .action-btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .action-btn:hover {
      background: #475569;
    }
    
    .iframe-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    /* Responsive adjustment for small screens */
    @media (max-width: 768px) {
      .arcade-container { flex-direction: column; }
      .sidebar { width: 100%; height: 220px; min-width: auto; }
      .main-stage { flex: 1; }
    }
  </style>
</head>
<body>

  <div class="arcade-container">
    <!-- Left Pane: Sidebar Game List -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>🧠 Mind Gym Arcade</h1>
        <p>Select a game to start training</p>
      </div>
      <div class="game-list" id="game-list"></div>
    </div>

    <!-- Right Pane: Active Game Stage -->
    <div class="main-stage">
      <div class="stage-header">
        <div class="stage-title-group">
          <h2 id="active-title">🎮 Select a Game</h2>
          <p id="active-desc">Choose from the sidebar menu</p>
        </div>
        <div class="stage-actions">
          <button class="action-btn" onclick="reloadGame()">🔄 Restart</button>
          <button class="action-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        </div>
      </div>
      <div class="iframe-container" id="iframe-wrap">
        <iframe id="game-frame" src=""></iframe>
      </div>
    </div>
  </div>

  <script>
    const games = [
      { icon: "🏁", title: "Grid Memory Runner", desc: "Memorize path sequences across scaling levels.", file: "grid-runner.html" },
      { icon: "🎨", title: "Color Says", desc: "Pattern recall with dynamically shifting brain rules.", file: "color-says.html" },
      { icon: "🧠", title: "Dual N-Back", desc: "Simultaneous spatial and auditory working memory training.", file: "dual-nback.html" },
      { icon: "🤹", title: "Dual Task", desc: "Multi-tasking cognitive focus and coordination test.", file: "dual-task.html" },
      { icon: "🌈", title: "Inverse Stroop", desc: "Color-word interference challenge.", file: "inverse-stroop.html" },
      { icon: "🧩", title: "Logic & Strategy", desc: "Strategic puzzle solving and logic builder.", file: "logic-builder.html" },
      { icon: "🧭", title: "Mental Navigation", desc: "Spatial mapping and mental orientation.", file: "mental-navigation.html" },
      { icon: "👁️", title: "Visual Memory", desc: "Short-term visual recall and pattern memory.", file: "visual-memory.html" },
      { icon: "🕵️", title: "Mystery Tray", desc: "Identify missing or new items on the detective tray.", file: "mystery-tray.html" },
      { icon: "💬", title: "Word Association", desc: "Verbal recall and neural linkage trainer.", file: "word-association.html" }
    ];

    let currentIndex = 0;

    function renderSidebar() {
      const container = document.getElementById('game-list');
      container.innerHTML = '';

      games.forEach((g, index) => {
        const item = document.createElement('button');
        item.className = `game-item ${index === currentIndex ? 'active' : ''}`;
        item.onclick = () => selectGame(index);
        item.innerHTML = `
          <div class="game-icon">${g.icon}</div>
          <div class="game-info">
            <div class="game-title">${g.title}</div>
            <div class="game-desc">${g.desc}</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function selectGame(index) {
      currentIndex = index;
      const game = games[index];

      renderSidebar();

      document.getElementById('active-title').innerHTML = `${game.icon} ${game.title}`;
      document.getElementById('active-desc').innerText = game.desc;
      document.getElementById('game-frame').src = game.file;
    }

    function reloadGame() {
      const iframe = document.getElementById('game-frame');
      iframe.src = iframe.src;
    }

    function toggleFullscreen() {
      const container = document.getElementById('iframe-wrap');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => alert(`Error: ${err.message}`));
      } else {
        document.exitFullscreen();
      }
    }

    // Auto-load the first game on start
    window.onload = () => {
      selectGame(0);
    };
  </script>
</body>
</html>
