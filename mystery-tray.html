<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detective's Mystery Tray - Fixed Audio</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Fredoka', 'Comic Sans MS', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            margin: 0; padding: 16px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .game-card {
            background: white; border-radius: 28px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
            width: 100%; max-width: 680px; padding: 24px;
            text-align: center; position: relative; border: 5px solid #ff9a9e;
        }
        .header-bar {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
        }
        h1 { color: #ff6b6b; margin: 0; font-size: 24px; }
        .rank-tag {
            background: #6c5ce7; color: white; padding: 4px 12px;
            border-radius: 12px; font-size: 14px; font-weight: bold;
        }
        .sound-btn {
            background: #ff7675; color: white; border: none; border-radius: 50%;
            width: 44px; height: 44px; font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 0px #d63031;
        }
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin: 12px 0; background: #f0f3f8; padding: 8px 16px; border-radius: 50px;
            font-weight: bold; color: #4a4a4a;
        }
        .tray-area {
            background: #f7d794; border: 8px solid #e1b12c; border-radius: 20px;
            min-height: 220px; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden; margin-bottom: 12px;
        }
        .cloth-cover {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, #ff6b6b 25%, #ff8e8e 25%, #ff8e8e 50%, #ff6b6b 50%, #ff6b6b 75%, #ff8e8e 75%, #ff8e8e 100%);
            background-size: 40px 40px; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-size: 24px; font-weight: bold;
            transition: transform 0.5s ease-in-out; z-index: 10;
        }
        .cloth-cover.hidden { transform: translateY(-100%); }
        .tray-grid {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 10px; width: 100%;
        }
        .item-card {
            background: white; border-radius: 14px; width: 72px; height: 72px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 30px; border: 2px solid #f5cd79; box-shadow: 0 4px 0px #dcdde1;
        }
        .item-label { font-size: 10px; color: #576574; font-weight: bold; margin-top: 2px; }
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
        .btn-option {
            background: #54a0ff; color: white; border: none; padding: 10px;
            border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0px #2e86de; font-family: inherit;
        }
        .btn-option.selected { background: #f1c40f !important; box-shadow: 0 4px 0px #f39c12 !important; }
        .btn-primary {
            background: #10ac84; color: white; border: none; padding: 14px 32px;
            border-radius: 50px; font-size: 20px; font-weight: bold; cursor: pointer;
            box-shadow: 0 5px 0px #0e9aa7; font-family: inherit;
        }
        .timer-bar { width: 100%; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin-bottom: 10px; }
        .timer-fill { height: 100%; background: #ff4757; width: 100%; transition: width 0.1s linear; }
        .feedback { font-size: 20px; font-weight: bold; margin-bottom: 10px; min-height: 28px; }
        .prompt-text { font-size: 18px; font-weight: bold; color: #2f3542; margin-bottom: 12px; min-height: 40px; }
    </style>
</head>
<body onclick="unlockAudio()">

<div class="game-card">
    <div class="header-bar">
        <h1>🕵️‍♂️ Mystery Tray</h1>
        <span class="rank-tag" id="rank-tag">🥉 Junior Sleuth</span>
        <button class="sound-btn" onclick="toggleAudio(event)" id="sound-toggle">🔊</button>
    </div>
    
    <div class="status-bar">
        <span id="round-badge">Round 1 / 30</span>
        <span id="streak-text">🔥 Streak: 0</span>
        <span id="score-text">⭐ 0 Stars</span>
    </div>

    <div class="timer-bar" id="timer-bar" style="display: none;">
        <div class="timer-fill" id="timer-fill"></div>
    </div>

    <div class="tray-area">
        <div class="cloth-cover hidden" id="cloth">
            <span>✨ Magic Cover! ✨</span>
        </div>
        <div class="tray-grid" id="tray-grid"></div>
    </div>

    <div class="prompt-text" id="prompt-text">30 Rounds Challenge! Ready?</div>
    <div class="feedback" id="feedback"></div>
    <div class="options-grid" id="options-grid" style="display: none;"></div>
    <button class="btn-primary" id="main-btn" onclick="startRound()">Start Round 1 🚀</button>
</div>

<script>
    let audioCtx = null;
    let isMuted = false;

    // Forces browser audio engine to unlock on any user interaction
    function unlockAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function toggleAudio(e) {
        if (e) e.stopPropagation();
        unlockAudio();
        isMuted = !isMuted;
        const btn = document.getElementById('sound-toggle');
        btn.innerText = isMuted ? '🔇' : '🔊';
        btn.style.backgroundColor = isMuted ? '#b2bec3' : '#ff7675';
    }

    function playSound(type) {
        if (isMuted) return;
        unlockAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;

        if (type === 'applause' || type === 'correct') {
            // Winning Chord Sound
            [523.25, 659.25, 783.99].forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                gain.gain.setValueAtTime(0.15, now + idx * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + idx * 0.08);
                osc.stop(now + idx * 0.08 + 0.3);
            });
        } else if (type === 'wrong') {
            // Error Sound
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'magic') {
            // Magic Sound
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.35);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.35);
        }
    }

    const itemsDB = [
        { id: '1', name: 'Duck', icon: '🐥' }, { id: '2', name: 'Car', icon: '🚗' },
        { id: '3', name: 'Banana', icon: '🍌' }, { id: '4', name: 'Bear', icon: '🧸' },
        { id: '5', name: 'Key', icon: '🔑' }, { id: '6', name: 'Apple', icon: '🍎' },
        { id: '7', name: 'Dino', icon: '🦖' }, { id: '8', name: 'Pizza', icon: '🍕' },
        { id: '9', name: 'Robot', icon: '🤖' }, { id: '10', name: 'Rocket', icon: '🚀' },
        { id: '11', name: 'Crown', icon: '👑' }, { id: '12', name: 'Guitar', icon: '🎸' },
        { id: '13', name: 'Cookie', icon: '🍪' }, { id: '14', name: 'Panda', icon: '🐼' },
        { id: '15', name: 'Ghost', icon: '👻' }, { id: '16', name: 'Cat', icon: '🐱' }
    ];

    const roundConfigs = [];
    for (let i = 1; i <= 30; i++) {
        let count = Math.min(10, Math.floor(3 + (i - 1) * 0.25));
        let remove = (i > 10 && i % 4 === 0) ? 2 : 1;
        let type = (i % 5 === 0) ? 'swap' : 'missing';
        let time = Math.max(5, 9 - Math.floor(i / 6));
        roundConfigs.push({ count, type, removeCount: remove, time });
    }

    let currentRound = 0, score = 0, streak = 0, targetAnswers = [], selectedAnswers = [], currentItems = [];

    function updateRank() {
        const tag = document.getElementById('rank-tag');
        if (currentRound >= 20) tag.innerText = '🥇 Legendary Inspector';
        else if (currentRound >= 10) tag.innerText = '🥈 Master Detective';
        else tag.innerText = '🥉 Junior Sleuth';
    }

    function renderTray(items) {
        const grid = document.getElementById('tray-grid');
        grid.innerHTML = '';
        items.forEach(item => {
            const el = document.createElement('div');
            el.className = 'item-card';
            el.innerHTML = `${item.icon}<span class="item-label">${item.name}</span>`;
            grid.appendChild(el);
        });
    }

    function startRound() {
        unlockAudio();
        document.getElementById('feedback').innerText = '';
        document.getElementById('main-btn').style.display = 'none';
        document.getElementById('options-grid').style.display = 'none';
        selectedAnswers = [];

        const config = roundConfigs[currentRound];
        document.getElementById('round-badge').innerText = `Round ${currentRound + 1} / 30`;
        updateRank();

        currentItems = [...itemsDB].sort(() => 0.5 - Math.random()).slice(0, config.count);
        renderTray(currentItems);
        document.getElementById('cloth').classList.add('hidden');

        document.getElementById('prompt-text').innerText = `Memorize these ${config.count} items!`;

        const timerFill = document.getElementById('timer-fill');
        document.getElementById('timer-bar').style.display = 'block';
        let elapsed = 0, duration = config.time * 1000;
        
        const timer = setInterval(() => {
            elapsed += 100;
            timerFill.style.width = Math.max(0, 100 - (elapsed / duration) * 100) + '%';
            if (elapsed >= duration) {
                clearInterval(timer);
                document.getElementById('timer-bar').style.display = 'none';
                coverAndModifyTray();
            }
        }, 100);
    }

    function coverAndModifyTray() {
        document.getElementById('cloth').classList.remove('hidden');
        playSound('magic');
        document.getElementById('prompt-text').innerText = "Changing the tray...";

        setTimeout(() => {
            const config = roundConfigs[currentRound];
            let newTray = [];

            if (config.type === 'missing') {
                const shuffled = [...currentItems].sort(() => 0.5 - Math.random());
                targetAnswers = shuffled.slice(0, config.removeCount).map(i => i.id);
                newTray = currentItems.filter(i => !targetAnswers.includes(i.id));
            } else {
                const intruder = itemsDB.find(i => !currentItems.includes(i));
                targetAnswers = [intruder.id];
                newTray = [...currentItems.slice(1), intruder];
            }

            renderTray(newTray);

            setTimeout(() => {
                document.getElementById('cloth').classList.add('hidden');
                setupQuestionPhase();
            }, 800);
        }, 1200);
    }

    function setupQuestionPhase() {
        const config = roundConfigs[currentRound];
        document.getElementById('prompt-text').innerText = config.type === 'missing' 
            ? `Which ${config.removeCount} item(s) disappeared?`
            : "Which item is new?";

        const grid = document.getElementById('options-grid');
        grid.innerHTML = '';
        grid.style.display = 'grid';

        let options = config.type === 'missing' ? [...currentItems] : [...currentItems, itemsDB.find(i => i.id === targetAnswers[0])];
        options.sort(() => 0.5 - Math.random()).forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerHTML = `${item.icon} ${item.name}`;
            btn.onclick = () => handleChoice(item.id, btn);
            grid.appendChild(btn);
        });
    }

    function handleChoice(id, btn) {
        const config = roundConfigs[currentRound];
        if (config.removeCount === 1) {
            if (targetAnswers.includes(id)) handleWin();
            else handleFail();
        } else {
            if (!selectedAnswers.includes(id)) {
                selectedAnswers.push(id);
                btn.classList.add('selected');
                if (selectedAnswers.length === config.removeCount) {
                    if (targetAnswers.every(v => selectedAnswers.includes(v))) handleWin();
                    else handleFail();
                }
            }
        }
    }

    function handleWin() {
        playSound('correct');
        streak++;
        score += 10 + (streak > 2 ? 5 : 0);
        document.getElementById('score-text').innerText = `⭐ ${score} Stars`;
        document.getElementById('streak-text').innerText = `🔥 Streak: ${streak}`;
        document.getElementById('feedback').innerText = "🎉 Correct!";
        document.getElementById('options-grid').style.display = 'none';

        currentRound++;
        if (currentRound < 30) {
            const mainBtn = document.getElementById('main-btn');
            mainBtn.innerText = `Start Round ${currentRound + 1} 🚀`;
            mainBtn.style.display = 'inline-block';
        } else {
            document.getElementById('prompt-text').innerText = "🏆 Victory! You conquered all 30 Rounds!";
        }
    }

    function handleFail() {
        playSound('wrong');
        streak = 0;
        document.getElementById('streak-text').innerText = `🔥 Streak: 0`;
        document.getElementById('feedback').innerText = "❌ Try Again!";
        selectedAnswers = [];
        setTimeout(() => {
            document.querySelectorAll('.btn-option').forEach(b => b.classList.remove('selected'));
        }, 600);
    }

    renderTray(itemsDB.slice(0, 3));
</script>

</body>
</html>
