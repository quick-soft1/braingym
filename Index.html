<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mind Gym Arcade</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0.75rem;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* Top Navigation (Desktop View) */
    .arcade-header {
      padding: 0.25rem 0;
    }
    .arcade-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .arcade-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Game Switcher Action Bar */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 0.5rem 0.75rem;
      border-radius: 12px;
    }
    .current-game-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .action-btns {
      display: flex;
      gap: 0.4rem;
    }
    .action-btn {
      background: #334155;
      border: 1px solid #475569;
      color: var(--text-main);
      padding: 0.3rem 0.6rem;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      transition: background 0.15s;
    }
    .action-btn:hover { background: #475569; }

    /* Main Game Area */
    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    /* Stats Bar */
    .stats-bar {
      background: var(--bg-dark);
      padding: 0.5rem 0.75rem;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .round-tag { color: #facc15; }
    .lives { color: #f43f5e; letter-spacing: 2px; }
    .gem-status { color: var(--accent-blue); }

    /* Instructions Banner */
    .banner {
      background: #38bdf81a;
      border: 1px solid #38bdf840;
      color: #7dd3fc;
      text-align: center;
      padding: 0.4rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* Grid Container */
    .grid-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0.25rem 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      background: var(--bg-dark);
      padding: 8px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      width: 250px;
      height: 250px;
    }
    .cell {
      background: var(--card-bg);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      position: relative;
    }

    .player-ball {
      width: 20px;
      height: 20px;
      background: radial-gradient(circle at 30% 30%, #60a5fa, #1d4ed8);
      border-radius: 50%;
      box-shadow: 0 0 8px #3b82f6;
    }

    /* Input Controls Section */
    .sequence-section {
      background: var(--bg-dark);
      padding: 0.4rem;
      border-radius: 10px;
      text-align: center;
    }
    .sequence-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 0.25rem;
    }
    .slots-wrapper {
      display: flex;
      justify-content: center;
      gap: 0.3rem;
      min-height: 32px;
    }
    .slot {
      width: 32px;
      height: 32px;
      background: var(--card-bg);
      border: 1px dashed #475569;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: var(--accent-blue);
    }
    .slot.filled { border-style: solid; border-color: var(--accent-blue); }

    /* Controls Pad */
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 40px);
      grid-template-rows: repeat(2, 34px);
      gap: 5px;
      justify-content: center;
    }
    .dbtn {
      background: #334155;
      border: 1px solid #475569;
      color: var(--text-main);
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dbtn-clear { background: #f43f5e; border-color: #e11d48; font-size: 0.65rem; }

    .btn-execute {
      background: #475569;
      color: var(--text-muted);
      border: none;
      padding: 0.6rem;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: not-allowed;
    }
    .btn-execute.ready {
      background: var(--accent-blue);
      color: var(--bg-dark);
      cursor: pointer;
    }

    /* Mobile Responsive CSS Overlay */
    @media (max-width: 600px) {
      body {
        padding: 0.25rem !important;
        height: 100dvh;
        overflow: hidden;
      }
      .app-container {
        height: 100dvh;
        justify-content: space-between;
      }
      .arcade-header {
        display: none;
      }
      .game-card {
        padding: 0.4rem !important;
        gap: 0.25rem !important;
        height: 100%;
        max-height: calc(100dvh - 55px);
        justify-content: space-between;
      }
      .grid {
        width: 220px;
        height: 220px;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="arcade-header">
      <div class="arcade-title">🧠 Mind Gym Arcade</div>
      <div class="arcade-subtitle">Select a game to start training</div>
    </div>

    <div class="action-bar">
      <div class="current-game-title">🤹 Dual Task</div>
      <div class="action-btns">
        <button class="action-btn" onclick="restartGame()">🔄 Restart</button>
        <button class="action-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
      </div>
    </div>

    <div class="game-card">
      <div class="stats-bar">
        <div class="round-tag" id="round-display">⭐ Round 1/30</div>
        <div class="lives" id="lives-display">❤️❤️❤️</div>
        <div class="gem-status" id="gem-display">💎 None</div>
      </div>

      <div class="banner" id="banner-text">Plan max 4 steps per turn to reach the Star ⭐!</div>

      <div class="grid-container">
        <div class="grid" id="grid"></div>
      </div>

      <div class="sequence-section">
        <div class="sequence-label">TURN BUFFER (MAX 4 STEPS)</div>
        <div class="slots-wrapper" id="slots-wrapper"></div>
      </div>

      <div class="dpad">
        <div></div>
        <button class="dbtn" onclick="addMove('UP')">⬆️</button>
        <div></div>
        <button class="dbtn" onclick="addMove('LEFT')">⬅️</button>
        <button class="dbtn dbtn-clear" onclick="clearMoves()">CLEAR</button>
        <button class="dbtn" onclick="addMove('RIGHT')">➡️</button>
        <div></div>
        <button class="dbtn" onclick="addMove('DOWN')">⬇️</button>
        <div></div>
      </div>

      <button class="btn-execute" id="exec-btn" onclick="executeSequence()">Execute Sequence 🚀</button>
    </div>
  </div>

  <script>
    const GRID_SIZE = 5;
    const MAX_TURN_STEPS = 4;
    let round = 1, lives = 3;
    let playerX = 0, playerY = 0, starX = 4, starY = 4;
    let walls = [], gems = [], collectedGems = 0;
    let plannedMoves = [], isSimulating = false;

    function setupRound() {
      plannedMoves = [];
      isSimulating = false;
      playerX = 0; playerY = 0;
      starX = 4; starY = 4;
      walls = [{x: 2, y: 1}, {x: 2, y: 2}];
      renderGrid();
      renderSlots();
    }

    function renderGrid() {
      const gridEl = document.getElementById('grid');
      gridEl.innerHTML = '';
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (c === playerX && r === playerY) {
            cell.innerHTML = '<div class="player-ball"></div>';
          } else if (c === starX && r === starY) {
            cell.innerText = '⭐';
          } else if (walls.some(w => w.x === c && w.y === r)) {
            cell.innerText = '🧱';
          }
          gridEl.appendChild(cell);
        }
      }
    }

    function renderSlots() {
      const wrapper = document.getElementById('slots-wrapper');
      wrapper.innerHTML = '';
      const arrows = { UP: '⬆️', DOWN: '⬇️', LEFT: '⬅️', RIGHT: '➡️' };
      for (let i = 0; i < MAX_TURN_STEPS; i++) {
        const slot = document.createElement('div');
        slot.className = `slot ${plannedMoves[i] ? 'filled' : ''}`;
        slot.innerText = plannedMoves[i] ? arrows[plannedMoves[i]] : '';
        wrapper.appendChild(slot);
      }
      const execBtn = document.getElementById('exec-btn');
      if (plannedMoves.length > 0 && !isSimulating) {
        execBtn.classList.add('ready');
      } else {
        execBtn.classList.remove('ready');
      }
    }

    function addMove(dir) {
      if (isSimulating || plannedMoves.length >= MAX_TURN_STEPS) return;
      plannedMoves.push(dir);
      renderSlots();
    }

    function clearMoves() {
      if (isSimulating) return;
      plannedMoves = [];
      renderSlots();
    }

    async function executeSequence() {
      if (plannedMoves.length === 0 || isSimulating) return;
      isSimulating = true;
      for (let move of plannedMoves) {
        await new Promise(r => setTimeout(r, 250));
        if (move === 'UP') playerY = Math.max(0, playerY - 1);
        if (move === 'DOWN') playerY = Math.min(GRID_SIZE - 1, playerY + 1);
        if (move === 'LEFT') playerX = Math.max(0, playerX - 1);
        if (move === 'RIGHT') playerX = Math.min(GRID_SIZE - 1, playerX + 1);
        renderGrid();
      }
      plannedMoves = [];
      renderSlots();
      isSimulating = false;
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function restartGame() { setupRound(); }
    window.onload = setupRound;
  </script>
</body>
</html>
