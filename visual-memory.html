<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Memory & Attention Challenge</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-color: #1e293b;
            --tile-bg: #334155;
            --tile-hover: #475569;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background-color 0.4s ease;
        }

        .container {
            background-color: var(--panel-color);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 550px;
            width: 100%;
            transition: background-color 0.4s ease;
        }

        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
        }

        .theme-select-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        select {
            background: var(--tile-bg);
            color: var(--text-color);
            border: 1px solid #475569;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            font-size: 0.85rem;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .mute-btn {
            background: var(--tile-bg);
            border: 1px solid #475569;
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .mute-btn:hover {
            background: var(--tile-hover);
        }

        .skills {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 15px;
            text-align: left;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.25);
            padding: 10px;
            border-radius: 8px;
        }

        .stat {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .message-box {
            height: 30px;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .grid-container {
            min-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .grid {
            display: grid;
            gap: 8px;
            margin: 0 auto;
            justify-content: center;
        }

        .tile {
            background-color: var(--tile-bg);
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.2s ease;
            user-select: none;
        }

        .tile:hover {
            transform: scale(1.03);
            background-color: var(--tile-hover);
        }

        .tile.active {
            background-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-color);
        }

        .tile.correct {
            background-color: #22c55e;
            box-shadow: 0 0 15px #22c55e;
        }

        .tile.wrong {
            background-color: #ef4444;
            box-shadow: 0 0 15px #ef4444;
        }

        .btn {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-controls">
            <div class="theme-select-container">
                <label for="theme-select">🎨 Theme:</label>
                <select id="theme-select">
                    <option value="slate">Dark Slate</option>
                    <option value="navy">Midnight Navy</option>
                    <option value="emerald">Deep Emerald</option>
                    <option value="cyber">Cyberpunk</option>
                    <option value="purple">Royal Purple</option>
                    <option value="sunset">Sunset Dark</option>
                    <option value="charcoal">Charcoal Grey</option>
                    <option value="crimson">Crimson Dusk</option>
                    <option value="espresso">Espresso Warm</option>
                    <option value="pitch">Pitch Black</option>
                </select>
            </div>
            <button class="mute-btn" id="mute-btn">🔊 Sound On</button>
        </div>

        <h1>Pattern Matrix Memory</h1>
        <p class="skills">Target Skills: Short-term visual memory, Focused attention</p>

        <div class="stats-bar">
            <div class="stat">
                <span class="stat-label">Round</span>
                <span class="stat-value" id="round">1 / 36</span>
            </div>
            <div class="stat">
                <span class="stat-label">Group</span>
                <span class="stat-value" id="group">3x3</span>
            </div>
            <div class="stat">
                <span class="stat-label">Score</span>
                <span class="stat-value" id="score">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Lives</span>
                <span class="stat-value" id="lives">3</span>
            </div>
        </div>

        <div class="message-box" id="message">Press Start to begin!</div>

        <div class="grid-container">
            <div class="grid" id="grid"></div>
        </div>

        <button class="btn" id="start-btn">Start Game</button>
    </div>

    <script>
        // Game State Variables
        let round = 1;
        let score = 0;
        let lives = 3;
        let isMuted = false;
        let targetTiles = [];
        let selectedTiles = [];
        let isMemorizePhase = false;
        let isGameActive = false;

        // UI Elements
        const gridElement = document.getElementById('grid');
        const startBtn = document.getElementById('start-btn');
        const muteBtn = document.getElementById('mute-btn');
        const themeSelect = document.getElementById('theme-select');
        const roundDisplay = document.getElementById('round');
        const groupDisplay = document.getElementById('group');
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('lives');
        const messageDisplay = document.getElementById('message');

        // Color Themes Definition (10 Options)
        const themes = {
            slate: { bg: '#0f172a', panel: '#1e293b', tile: '#334155', hover: '#475569', accent: '#38bdf8', text: '#f8fafc' },
            navy: { bg: '#0a0a2e', panel: '#1a1a3e', tile: '#2d2d5a', hover: '#3d3d7a', accent: '#38edf8', text: '#f8fafc' },
            emerald: { bg: '#062016', panel: '#0e3827', tile: '#1b523c', hover: '#286e52', accent: '#34d399', text: '#f0fdf4' },
            cyber: { bg: '#180828', panel: '#280e42', tile: '#411966', hover: '#5a258c', accent: '#f43f5e', text: '#fdf4ff' },
            purple: { bg: '#170c2c', panel: '#2a174d', tile: '#3d246c', hover: '#54338d', accent: '#a855f7', text: '#faf5ff' },
            sunset: { bg: '#1f0d18', panel: '#331828', tile: '#4d263d', hover: '#663553', accent: '#fb923c', text: '#fff7ed' },
            charcoal: { bg: '#121212', panel: '#1e1e1e', tile: '#2d2d2d', hover: '#3d3d3d', accent: '#a1a1aa', text: '#f4f4f5' },
            crimson: { bg: '#1a0505', panel: '#2e0a0a', tile: '#4a1515', hover: '#662222', accent: '#f87171', text: '#fef2f2' },
            espresso: { bg: '#1c130e', panel: '#2d2018', tile: '#453327', hover: '#5c4536', accent: '#fbbf24', text: '#fffbeb' },
            pitch: { bg: '#000000', panel: '#111111', tile: '#222222', hover: '#333333', accent: '#00ffcc', text: '#ffffff' }
        };

        // Theme Switcher Event
        themeSelect.addEventListener('change', (e) => {
            const theme = themes[e.target.value];
            document.documentElement.style.setProperty('--bg-color', theme.bg);
            document.documentElement.style.setProperty('--panel-color', theme.panel);
            document.documentElement.style.setProperty('--tile-bg', theme.tile);
            document.documentElement.style.setProperty('--tile-hover', theme.hover);
            document.documentElement.style.setProperty('--accent-color', theme.accent);
            document.documentElement.style.setProperty('--text-color', theme.text);
        });

        // Web Audio Synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (isMuted) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;

            if (type === 'correct_click') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.12);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            } 
            else if (type === 'wrong_click') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.setValueAtTime(110, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }
            else if (type === 'round_complete') {
                const notes = [523.25, 659.25, 783.99];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.06);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.06 + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.06);
                    osc.stop(now + idx * 0.06 + 0.2);
                });
            }
            else if (type === 'clap') {
                for (let i = 0; i < 30; i++) {
                    const clapTime = now + (Math.random() * 0.9);
                    const bufferSize = audioCtx.sampleRate * 0.04;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let j = 0; j < bufferSize; j++) {
                        data[j] = Math.random() * 2 - 1;
                    }

                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 1000 + Math.random() * 800;

                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(0.2, clapTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, clapTime + 0.04);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioCtx.destination);

                    noise.start(clapTime);
                    noise.stop(clapTime + 0.04);
                }
            }
        }

        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            muteBtn.textContent = isMuted ? "🔇 Muted" : "🔊 Sound On";
        });

        startBtn.addEventListener('click', startGame);

        function startGame() {
            round = 1;
            score = 0;
            lives = 3;
            isGameActive = true;
            startBtn.disabled = true;
            updateStats();
            setupRound();
        }

        function updateStats() {
            roundDisplay.textContent = `${round} / 36`;
            scoreDisplay.textContent = score;
            livesDisplay.textContent = '❤️'.repeat(lives);

            if (round <= 6) {
                groupDisplay.textContent = "3x3 Group";
            } else if (round <= 16) {
                groupDisplay.textContent = "4x4 Group";
            } else if (round <= 26) {
                groupDisplay.textContent = "5x5 Group";
            } else {
                groupDisplay.textContent = "6x6 Group";
            }
        }

        function setupRound() {
            let dim, patternSize;

            // Updated Group Structure
            if (round <= 6) {
                dim = 3;
                patternSize = 3 + Math.floor((round - 1) / 3); // 3 to 4 targets
            } else if (round <= 16) {
                dim = 4;
                patternSize = 4 + Math.floor((round - 7) / 3); // 4 to 7 targets
            } else if (round <= 26) {
                dim = 5;
                patternSize = 5 + Math.floor((round - 17) / 2); // 5 to 9 targets
            } else {
                dim = 6;
                patternSize = 7 + Math.floor((round - 27) / 2); // 7 to 11 targets
            }

            selectedTiles = [];
            targetTiles = [];

            createGrid(dim);
            generateDispersedPattern(dim, patternSize);
            showPattern(round);
        }

        function createGrid(dim) {
            gridElement.innerHTML = '';
            gridElement.style.gridTemplateColumns = `repeat(${dim}, 1fr)`;
            
            const tileSize = dim === 3 ? '75px' : dim === 4 ? '60px' : dim === 5 ? '50px' : '42px';

            for (let i = 0; i < dim * dim; i++) {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                tile.style.width = tileSize;
                tile.style.height = tileSize;
                tile.dataset.id = i;
                tile.addEventListener('click', () => handleTileClick(i));
                gridElement.appendChild(tile);
            }
        }

        // Anti-clustering pattern generator to increase cognitive difficulty
        function generateDispersedPattern(dim, size) {
            const totalTiles = dim * dim;
            let attempts = 0;
            
            while (targetTiles.length < size && attempts < 500) {
                attempts++;
                const candidate = Math.floor(Math.random() * totalTiles);
                
                if (targetTiles.includes(candidate)) continue;

                // Check distance against already picked tiles
                if (targetTiles.length > 0) {
                    const cRow = Math.floor(candidate / dim);
                    const cCol = candidate % dim;

                    let tooCloseCount = 0;
                    for (let id of targetTiles) {
                        const r = Math.floor(id / dim);
                        const c = id % dim;
                        const dist = Math.abs(cRow - r) + Math.abs(cCol - c);
                        if (dist <= 1) { // Directly adjacent
                            tooCloseCount++;
                        }
                    }

                    // Reject candidate if it forms a tight adjacent clump
                    if (tooCloseCount > 1 && attempts < 300) {
                        continue;
                    }
                }

                targetTiles.push(candidate);
            }
        }

        function showPattern(currentRound) {
            isMemorizePhase = true;
            messageDisplay.textContent = "Memorize the pattern!";
            messageDisplay.style.color = "var(--accent-color)";

            const tiles = document.querySelectorAll('.tile');
            targetTiles.forEach(id => {
                tiles[id].classList.add('active');
            });

            // Display speed scales dynamically
            const displayTime = Math.max(700, 2200 - (currentRound * 40));

            setTimeout(() => {
                targetTiles.forEach(id => {
                    tiles[id].classList.remove('active');
                });
                isMemorizePhase = false;
                messageDisplay.textContent = "Recreate the pattern!";
                messageDisplay.style.color = "var(--text-color)";
            }, displayTime);
        }

        function handleTileClick(id) {
            if (isMemorizePhase || !isGameActive || selectedTiles.includes(id)) return;

            const tiles = document.querySelectorAll('.tile');
            const tile = tiles[id];

            if (targetTiles.includes(id)) {
                playSound('correct_click');
                tile.classList.add('correct');
                selectedTiles.push(id);

                if (selectedTiles.length === targetTiles.length) {
                    playSound('round_complete');
                    score += round * 10;
                    
                    // Clapping applause trigger at group transitions (6, 16, 26, 36)
                    if (round === 6 || round === 16 || round === 26 || round === 36) {
                        setTimeout(() => playSound('clap'), 200);
                    }

                    round++;
                    updateStats();

                    if (round > 36) {
                        gameWin();
                    } else {
                        messageDisplay.textContent = "Round Cleared!";
                        messageDisplay.style.color = "#22c55e";
                        isMemorizePhase = true;
                        setTimeout(setupRound, 1200);
                    }
                }
            } else {
                playSound('wrong_click');
                tile.classList.add('wrong');
                lives--;
                updateStats();

                if (lives <= 0) {
                    gameOver();
                } else {
                    messageDisplay.textContent = "Wrong Tile! Try again...";
                    messageDisplay.style.color = "#ef4444";
                    
                    targetTiles.forEach(targetId => {
                        tiles[targetId].classList.add('active');
                    });
                    
                    isMemorizePhase = true;
                    setTimeout(setupRound, 1500);
                }
            }
        }

        function gameWin() {
            isGameActive = false;
            playSound('clap');
            messageDisplay.textContent = `🏆 Mastered All 36 Rounds! Final Score: ${score}`;
            messageDisplay.style.color = "#22c55e";
            startBtn.textContent = "Play Again";
            startBtn.disabled = false;
        }

        function gameOver() {
            isGameActive = false;
            messageDisplay.textContent = `Game Over! Score: ${score} (Reached Round ${round})`;
            messageDisplay.style.color = "#ef4444";
            startBtn.textContent = "Try Again";
            startBtn.disabled = false;

            const tiles = document.querySelectorAll('.tile');
            targetTiles.forEach(id => {
                if (!selectedTiles.includes(id)) {
                    tiles[id].classList.add('active');
                }
            });
        }
    </script>
</body>
</html>
